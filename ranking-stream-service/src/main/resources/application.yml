management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,streams,redis,db
      show-details: when_authorized
logging:
  structured:
    format:
      console: logstash
server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200
spring:
  application:
    name: ranking-stream-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      type: batch
      ack-mode: batch
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ranking}
    username: ${POSTGRES_USER:ranking}
    password: ${POSTGRES_PASSWORD:ranking}
    hikari:
      maximum-pool-size: 4
ranking:
  state-dir: ${STATE_DIR:.state}
  threads: ${STREAM_THREADS:2}
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
